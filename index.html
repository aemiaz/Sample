<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#14213d">
<style>
:root{--ink:#14213d;--c:#0877b0;--m:#c2255c;--g:#168a45;--r:#b42318;--line:#dbe2ea;--mu:#566377;--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:#f2f5f9;color:#17202e}
main{max-width:980px;margin:0 auto;padding:0 14px 40px}
h1,h2,h3{font-family:var(--d)}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea,button{font:inherit;padding:11px 12px;border:1px solid #c3ccd8;border-radius:10px;min-height:46px;background:#fff;color:inherit}
input,select,textarea{width:100%}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;border:0;font-weight:600;cursor:pointer;padding:10px 16px;text-decoration:none;border-radius:10px;min-height:44px}
button.sec,.btn.sec{background:#e4eaf2;color:#17202e}.btn.wa{background:var(--g)}button.bad{background:#fff;color:var(--r);border:1px solid #e7b4af}
.gh{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.3)!important}
button.sm,.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brand{background:var(--ink);color:#fff}.brand :focus-visible{outline-color:#fff}
.bin{max-width:980px;margin:0 auto;padding:16px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cmyk{display:flex;height:6px}.cmyk i{flex:1}.cmyk i:nth-child(1){background:#00aeef}.cmyk i:nth-child(2){background:#ec008c}.cmyk i:nth-child(3){background:#fff200}.cmyk i:nth-child(4){background:#000}
.logo{width:60px;height:60px;border-radius:14px;background:#fff;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.logo b{display:grid;place-items:center;height:100%;background:var(--c);color:#fff;font:700 26px var(--d)}.logo.big{width:84px;height:84px;border:1px solid var(--line)}
.bi{flex:1;min-width:180px}.bi h1{margin:0 0 4px;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;margin:2px 0;font-size:14px;color:#cbd5e8}.meta a{color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cust .acts{flex-basis:100%}.own .acts{margin-left:auto}
.chip{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);font-size:14px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff6b6b;margin-right:6px}.dot.on{background:#3ddc84}
.bdg{background:var(--m);color:#fff;border-radius:10px;padding:0 6px;font-size:12px}
.intro{font-size:17px;margin:18px 0 4px}.muted{color:var(--mu);font-size:14px}.err{color:var(--r);font-size:14px;min-height:20px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-weight:400}.chk input{width:auto;min-height:0}.center{text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{background:none;color:var(--mu);border-radius:0;border-bottom:3px solid transparent;min-height:48px}.tabs button[aria-current=page]{color:var(--ink);border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat span{font-size:13px;color:var(--mu)}.stat b{display:block;font:700 28px/1.1 var(--d)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.bar>*{flex:1;min-width:160px}
.orow{display:grid;grid-template-columns:1.2fr 1.2fr 1.6fr auto;gap:6px 14px;align-items:center;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:8px;color:inherit;text-decoration:none}
.orow.new{border-left:4px solid var(--m)}.orow:hover{border-color:var(--c)}.orow b,.orow .muted{display:block}
.tag{display:inline-block;background:#eef2f7;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;margin:0 6px 4px 0}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;background:#e4eaf2;color:#3b4656;white-space:nowrap}
.st-new{background:#fde7ef;color:#9d1c4a}.st-review,.st-hold{background:#fff3cd;color:#7a5600}.st-accepted,.st-payment{background:#dff1fa;color:#065f8d}
.st-production{background:var(--ink);color:#fff}.st-ready{background:#dcf3e5;color:#0f6b36}.st-rejected,.st-cancelled{background:#fbe4e1;color:#912018}
.dg,.sg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 12px}.kv dt{color:var(--mu);font-size:14px}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.fi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.fi span{flex:1;min-width:140px;font-weight:600;overflow-wrap:anywhere}
.tl{margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);list-style:none}.tl li{padding:0 0 10px 6px}
@media(max-width:700px){.dg,.sg{grid-template-columns:1fr}.orow{grid-template-columns:1fr auto}.orow>:nth-child(2),.orow>:nth-child(3){grid-column:1/-1}.orow>:nth-child(4){grid-row:1;grid-column:2}}
@media print{body *{visibility:hidden}#qrcard,#qrcard *{visibility:visible}#qrcard{position:absolute;left:0;top:0;width:100%;border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="app">Loading...</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* ===== PrintDesk (single file, no server) =====
   Admin opens this page normally. Customers open it via QR (?shop=ID).
   Files travel phone -> shop computer directly (WebRTC). The shop page must be open to receive. */
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const SHOP=new URLSearchParams(location.search).get('shop');
const BASE=location.origin+location.pathname;
const ALLOWED={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const ST={new:'New',review:'Under Review',accepted:'Accepted',payment:'Payment Pending',production:'In Production',ready:'Ready',completed:'Completed',rejected:'Rejected',cancelled:'Cancelled',hold:'On Hold'};
const FLOW={new:['review','rejected','cancelled'],review:['accepted','rejected','cancelled','hold'],accepted:['payment','production','cancelled','hold'],payment:['production','cancelled'],production:['ready','hold'],ready:['completed'],hold:['review','accepted','production','cancelled'],completed:[],rejected:[],cancelled:[]};
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const DEF={shop_name:'My Print Shop',welcome:'Upload your documents and submit your printing requirements.',phone:'',whatsapp:'',address:'',logo:'',cc:'92',max_mb:'20',extras:'Spiral binding\nLamination\nStapling'};
const CFG=()=>({...DEF,...JSON.parse(localStorage.pd_cfg||'{}')});
const svc=c=>{try{const j=JSON.parse(c.extras);if(Array.isArray(j))return j.map(String);if(j&&typeof j==='object')return Object.keys(j)}catch{}return String(c.extras||'').split('\n').map(x=>x.trim()).filter(Boolean)};
const dg=s=>String(s??'').replace(/\D/g,'');
const safeImg=s=>/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||'')?s:'';
const waNum=p=>{let d=dg(p);if(d.startsWith('00'))d=d.slice(2);else if(d[0]==='0')d=dg(CFG().cc)+d.slice(1);return d};
const fmt=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const ini=n=>E((String(n).trim().match(/[\p{L}\p{N}]/u)||['?'])[0].toUpperCase());
const TY={bw:'Black & White',color:'Color',photo:'Photo',other:'Other'};
const I={ph:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
 wa:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
 pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
 bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'};
const ic=n=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';
/* Shop header used on both customer ('cust') and owner ('own') sides */
function brand(c,m){const l=safeImg(c.logo),t=String(c.phone||'').trim(),a=String(c.address||'').trim(),w=dg(c.whatsapp),tl='tel:'+E(t.replace(/[^\d+]/g,''));
 const meta=(a?'<p class="meta">'+ic('pin')+'<span>'+E(a)+'</span></p>':'')+(t?'<p class="meta">'+ic('ph')+'<a href="'+tl+'">'+E(t)+'</a></p>':'')||(m==='own'?'<p class="meta"><a href="#" id="hint">Add your address and phone in Settings</a></p>':'');
 const acts=m==='cust'?(t?'<a class="btn gh" href="'+tl+'">'+ic('ph')+'Call</a>':'')+(w?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+w+'">'+ic('wa')+'WhatsApp</a>':'')+(a?'<a class="btn gh" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(a)+'">'+ic('nav')+'Directions</a>':''):
  '<span class="chip" id="dot"></span><button class="gh" id="bell" aria-label="Notifications">'+ic('bell')+'<span class="bdg" id="ub" hidden>0</span></button><button class="gh" id="lo">'+ic('out')+'Log out</button>';
 return'<div class="brand"><div class="bin '+m+'"><div class="logo">'+(l?'<img src="'+l+'" alt="">':'<b>'+ini(c.shop_name)+'</b>')+'</div><div class="bi"><h1>'+E(c.shop_name)+'</h1>'+meta+'</div><div class="acts">'+acts+'</div></div></div><div class="cmyk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>'}
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch{}};
addEventListener('offline',()=>alert('Connection Lost'));

/* ================= CUSTOMER ================= */
function customer(){
  let conn,cfg,files=[],busy=false;
  const app=$('#app');
  const peer=new Peer();
  const show=(h)=>app.innerHTML=h,head=c=>$('#hdr').innerHTML=brand(c,'cust');
  show('<div class="card">Connecting to the shop...</div>');
  const closed=()=>show('<div class="card"><h1>Shop is currently closed</h1><p>The shop is not receiving requests right now. Please try again during shop hours.</p><button onclick="location.reload()">Retry</button></div>');
  const timer=setTimeout(closed,12000);
  peer.on('error',closed);
  peer.on('open',()=>{conn=peer.connect(SHOP,{reliable:true});
    conn.on('open',()=>conn.send({t:'hello'}));
    conn.on('close',()=>{if(!busy)closed()});
    conn.on('data',m=>{
      if(m.t==='cfg'){clearTimeout(timer);cfg=m;form()}
      if(m.t==='status'&&$('#st'))$('#st').innerHTML=m.ok?'Status: <span class="pill st-'+E(m.status)+'">'+E(ST[m.status]||m.status)+'</span>':'Order not found';
    })});
  function form(){
    document.title=cfg.shop_name+' - Print Request';
    const last=JSON.parse(localStorage['pd_last_'+SHOP]||'null');
    head(cfg);show('<p class="intro">'+E(cfg.welcome)+'</p>'+
    (last?'<div class="card"><b>Your last request: '+E(last.number)+'</b><p id="st" class="muted"></p><button class="sec" id="chk">Check status</button></div>':'')+
    '<div class="card"><h2>Your details</h2><label for="n">Full name</label><input id="n" autocomplete="name"><label for="p">Mobile / WhatsApp</label><input id="p" type="tel" autocomplete="tel"><label for="e">Email (optional)</label><input id="e" type="email"></div>'+
    '<div class="card"><h2>Files</h2><input id="f" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" aria-label="Choose files"><div id="fl"></div><p class="muted">PDF, JPG, PNG, DOC, DOCX. Max '+E(cfg.max_mb)+' MB each, up to 10 files.</p></div>'+
    '<div class="card"><h2>Printing</h2><div class="row"><div><label for="t">Type</label><select id="t"><option value="bw">Black &amp; White</option><option value="color">Color</option><option value="photo">Photo</option><option value="other">Other</option></select></div><div><label for="s">Paper size</label><select id="s"><option>A4</option><option>A5</option><option>A3</option><option>Letter</option><option>Legal</option><option>Custom</option></select></div></div>'+
    '<div class="row"><div><label for="d">Sides</label><select id="d"><option value="single">Single-sided</option><option value="double">Double-sided</option></select></div><div><label for="o">Orientation</label><select id="o"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div><div><label for="c">Copies</label><input id="c" type="number" min="1" value="1" inputmode="numeric"></div></div>'+
    (cfg.extras.length?'<label>Additional services</label>'+cfg.extras.map(x=>'<label class="chk"><input type="checkbox" class="ex" value="'+E(x)+'">'+E(x)+'</label>').join(''):'')+
    '<label for="i">Special instructions</label><textarea id="i" rows="3"></textarea></div><div class="err" id="er" role="alert"></div><button id="go">Submit printing request</button>');
    if(last)$('#chk').onclick=()=>{conn.send({t:'track',token:last.token})};
    $('#f').onchange=e=>{for(const f of e.target.files){
      if(!ALLOWED[ext(f.name)]){$('#er').textContent='This file type is not supported.';continue}
      if(f.size>(+cfg.max_mb)*1048576){$('#er').textContent=f.name+' is too large.';continue}
      if(files.length<10)files.push({file:f,state:'ready'})}e.target.value='';list()};
    $('#go').onclick=submit;
  }
  function list(){$('#fl').innerHTML=files.map((f,i)=>'<p><b>'+E(f.file.name)+'</b> <span class="muted">'+(f.file.size/1024).toFixed(0)+' KB - '+E(f.state)+'</span> '+(busy?'':'<button class="sec" data-i="'+i+'">Remove</button>')+'</p>').join('');
    document.querySelectorAll('#fl button').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);list()})}
  const waitFor=(type,ms=60000)=>new Promise((ok,no)=>{const t=setTimeout(()=>{conn.off('data',h);no(new Error('timeout'))},ms);const h=m=>{if(m.t===type||m.t==='reject'){clearTimeout(t);conn.off('data',h);m.t==='reject'?no(new Error(m.error)):ok(m)}};conn.on('data',h)});
  async function submit(){
    if(busy)return;const er=$('#er');er.textContent='';
    const name=$('#n').value.trim(),phone=$('#p').value.replace(/[^\d+]/g,'');
    if(!name||phone.length<7)return er.textContent='Please enter your name and a valid mobile number.';
    if(!files.length)return er.textContent='Please add at least one file.';
    if(!conn.open)return er.textContent='Connection lost. Your request has not been submitted.';
    busy=true;$('#go').disabled=true;$('#go').textContent='Submitting...';list();
    try{
      conn.send({t:'order',count:files.length,order:{name,phone,email:$('#e').value.trim(),type:$('#t').value,size:$('#s').value,sides:$('#d').value,orient:$('#o').value,copies:$('#c').value,instructions:$('#i').value,extras:[...document.querySelectorAll('.ex:checked')].map(c=>c.value)}});
      const ok=await waitFor('order_ok',15000);
      for(let i=0;i<files.length;i++){files[i].state='sending...';list();
        const buf=await files[i].file.arrayBuffer();conn.send({t:'file',token:ok.token,i,name:files[i].file.name,data:buf});
        await waitFor('ack',120000);files[i].state='sent';list()}
      localStorage['pd_last_'+SHOP]=JSON.stringify({number:ok.number,token:ok.token});
      show('<div class="card"><h2>Request Submitted Successfully</h2><p>Your request number:</p><h1>'+E(ok.number)+'</h1><p class="muted">Bookmark this page to check your order status while the shop is open.</p><button onclick="location.reload()">Done</button></div>');
    }catch(e){busy=false;$('#go').disabled=false;$('#go').textContent='Submit printing request';er.textContent=(e.message==='timeout'?'Connection lost. ':'')+(e.message&&e.message!=='timeout'?e.message+' ':'')+'Your request may not have been completed. Please try again.';list()}
  }
}

/* ================= ADMIN ================= */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('printdesk',1);r.onupgradeneeded=()=>r.result.createObjectStore('orders',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(mode,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction('orders',mode),r=f(t.objectStore('orders'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
const allO=()=>tx('readonly',s=>s.getAll()),getO=id=>tx('readonly',s=>s.get(id)),putO=o=>tx('readwrite',s=>s.put(o));
const log=(o,msg)=>{o.log.unshift({t:Date.now(),m:msg})};
let view='orders',unread=0,peerOK=false;

async function admin(){
  const app=$('#app');
  const form=(title,fields,btn,fn)=>{app.innerHTML='<div class="card" style="max-width:420px;margin:40px auto"><h1>'+title+'</h1>'+fields.map(f=>'<label for="'+f[0]+'">'+f[1]+'</label><input id="'+f[0]+'" type="'+(f[2]||'text')+'">').join('')+'<div class="err" id="er" role="alert"></div><button id="ok">'+btn+'</button></div>';
    $('#ok').onclick=async()=>{const r=await fn(Object.fromEntries(fields.map(f=>[f[0],$('#'+f[0]).value])));if(r)$('#er').textContent=r}};
  if(!localStorage.pd_pw)return form('Create shop password',[['shop','Shop name'],['pw','Password (8+ characters)','password']],'Create',async b=>{
    if(b.pw.length<8||!b.shop.trim())return'Enter shop name and a password of 8+ characters.';
    const salt=rnd(8);localStorage.pd_pw=salt+':'+await sha(salt+b.pw);localStorage.pd_cfg=JSON.stringify({shop_name:b.shop.trim()});sessionStorage.pd_in='1';admin()});
  if(!sessionStorage.pd_in)return form('Shop login',[['pw','Password','password']],'Sign in',async b=>{
    const [s,h]=localStorage.pd_pw.split(':');if(await sha(s+b.pw)!==h)return'Wrong password';sessionStorage.pd_in='1';admin()});
  if(!localStorage.pd_id)localStorage.pd_id='pd-'+rnd(10);
  startPeer();shell();go('orders');
}
function startPeer(){
  const peer=new Peer(localStorage.pd_id);
  const dot=()=>{if($('#dot'))$('#dot').innerHTML='<span class="dot'+(peerOK?' on':'')+'"></span>'+(peerOK?'Receiving requests':'Offline')};
  peer.on('open',()=>{peerOK=true;dot()});
  peer.on('disconnected',()=>{peerOK=false;dot();setTimeout(()=>peer.reconnect(),3000)});
  peer.on('error',e=>{peerOK=false;dot();if(e.type==='unavailable-id')alert('PrintDesk is already open in another tab or window. Close it first.')});
  peer.on('connection',c=>{let n=0;c.on('data',async m=>{try{
    const cfg=CFG();
    if(m.t==='hello')return c.send({t:'cfg',shop_name:cfg.shop_name,welcome:cfg.welcome,phone:cfg.phone,whatsapp:cfg.whatsapp,address:cfg.address,logo:safeImg(cfg.logo),max_mb:cfg.max_mb,extras:svc(cfg)});
    if(m.t==='order'){
      const d=m.order||{},name=String(d.name||'').trim().slice(0,80),phone=String(d.phone||'').replace(/[^\d+]/g,'').slice(0,16),count=+m.count;
      if(++n>5||!name||phone.length<7||!(count>=1&&count<=10))return c.send({t:'reject',error:'Invalid request.'});
      const pick=(v,a,df)=>a.includes(v)?v:df,day=new Date().toISOString().slice(0,10).replace(/-/g,''),k='pd_seq_'+day,seq=(+localStorage[k]||0)+1;localStorage[k]=seq;
      const o={id:rnd(8),number:`PR-${day}-${String(seq).padStart(5,'0')}`,token:rnd(16),created:Date.now(),updated:Date.now(),status:'new',expected:count,files:[],subtotal:0,discount:0,paid:0,payments:[],log:[],
        customer:{name,phone,email:String(d.email||'').slice(0,100)},instructions:String(d.instructions||'').slice(0,2000),
        opts:{type:pick(d.type,['bw','color','photo','other'],'bw'),size:pick(d.size,['A4','A5','A3','Letter','Legal','Custom'],'A4'),sides:pick(d.sides,['single','double'],'single'),orient:pick(d.orient,['portrait','landscape'],'portrait'),copies:Math.min(Math.max(parseInt(d.copies)||1,1),10000),extras:(Array.isArray(d.extras)?d.extras:[]).map(String).slice(0,10)}};
      log(o,'Request received');await putO(o);c.send({t:'order_ok',number:o.number,token:o.token});
      unread++;beep();if('Notification'in window&&Notification.permission==='granted')new Notification('New Printing Request',{body:o.number+' - '+name+' - '+o.opts.size+' x'+o.opts.copies});
      refresh();return}
    if(m.t==='file'){
      const o=(await allO()).find(x=>x.token===m.token);if(!o||o.files.length>=o.expected)return c.send({t:'reject',error:'Invalid upload.'});
      const nm=String(m.name||'').replace(/[^\w.\- ()]/g,'_').slice(0,120),e=ext(nm);
      if(!ALLOWED[e]||!(m.data&&m.data.byteLength)||m.data.byteLength>(+cfg.max_mb)*1048576)return c.send({t:'reject',error:'This file type is not supported.'});
      o.files.push({name:nm,size:m.data.byteLength,added:Date.now(),blob:new Blob([m.data],{type:ALLOWED[e]})});o.updated=Date.now();await putO(o);c.send({t:'ack',i:m.i});refresh();return}
    if(m.t==='track'){const o=(await allO()).find(x=>x.token===m.token);return c.send(o?{t:'status',ok:true,status:o.status}:{t:'status',ok:false})}
  }catch(e){console.error(e);try{c.send({t:'reject',error:'Something went wrong.'})}catch{}}})});
}
const badge=()=>{const b=$('#ub');if(b){b.textContent=unread;b.hidden=!unread}};
function shell(){
  const cfg=CFG();document.title=cfg.shop_name+' - Dashboard';
  $('#hdr').innerHTML=brand(cfg,'own');
  $('#app').innerHTML='<nav class="tabs" aria-label="Sections">'+[['orders','Orders'],['qr','QR Code'],['settings','Settings']].map(t=>'<button data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</nav><div id="stats" class="stats"></div><div id="v"></div>';
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#bell').onclick=()=>{unread=0;badge();if('Notification'in window)Notification.requestPermission();go('orders')};
  $('#lo').onclick=()=>{sessionStorage.clear();location.reload()};
  if($('#hint'))$('#hint').onclick=e=>{e.preventDefault();go('settings')};
  $('#dot').innerHTML='<span class="dot'+(peerOK?' on':'')+'"></span>'+(peerOK?'Receiving requests':'Connecting...');badge();
}
const go=v=>{view=v;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));$('#stats').hidden=v!=='orders';({orders,qr,settings}[v])()};
async function refresh(){badge();stats();if(view==='orders'&&!$('#detail'))orders();else if($('#detail'))detail($('#detail').dataset.id)}
async function stats(){const a=await allO(),c=s=>a.filter(o=>o.status===s).length,t0=new Date().setHours(0,0,0,0);
  $('#stats').innerHTML=[['New',c('new')],['In production',c('production')],['Ready',c('ready')],['Orders today',a.filter(o=>o.created>=t0).length],['Customers',new Set(a.map(o=>o.customer.phone)).size]].map(s=>'<div class="stat"><span>'+s[0]+'</span><b>'+E(s[1])+'</b></div>').join('')}
async function orders(){
  $('#stats').hidden=false;
  const keep=document.activeElement&&document.activeElement.id==='q',s=$('#s')?.value||'',q=($('#q')?.value||'').toLowerCase();
  const all=await allO(),list=all.sort((a,b)=>b.created-a.created).filter(o=>(!s||o.status===s)&&(o.number.toLowerCase().includes(q)||o.customer.name.toLowerCase().includes(q)||o.customer.phone.includes(q)));
  $('#v').innerHTML='<div class="bar"><input id="q" type="search" placeholder="Search order #, name, phone" value="'+E(q)+'" aria-label="Search"><select id="s" aria-label="Status"><option value="">All statuses</option>'+Object.entries(ST).map(x=>'<option value="'+x[0]+'"'+(x[0]===s?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'+
  (list.map(o=>{const p=o.opts;return'<a href="#" class="orow'+(o.status==='new'?' new':'')+'" data-id="'+o.id+'"><div><b>'+E(o.number)+'</b><span class="muted">'+fmt(o.created)+'</span></div><div><b>'+E(o.customer.name)+'</b><span class="muted">'+E(o.customer.phone)+'</span></div><div><span class="tag">'+E(p.size)+'</span><span class="tag">'+E(TY[p.type]||p.type)+'</span><span class="tag">'+E(p.copies)+' copies</span><span class="tag">'+o.files.length+'/'+o.expected+' files</span></div><span class="pill st-'+o.status+'">'+ST[o.status]+'</span></a>'}).join('')||'<div class="card center"><h2>'+(all.length?'No matching orders':'No requests yet')+'</h2><p class="muted">'+(all.length?'Try a different search or status.':'Customers send files by scanning your QR code. Keep this page open during shop hours.')+'</p></div>');
  if(keep){const i=$('#q');i.focus();try{i.setSelectionRange(q.length,q.length)}catch{}}
  stats();let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(orders,250)};$('#s').onchange=orders;
  document.querySelectorAll('[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();detail(a.dataset.id)});
}
async function detail(id){
  const o=await getO(id);if(!o)return orders();const c=o.customer,p=o.opts,w=waNum(c.phone);$('#stats').hidden=true;
  const MAIN={new:'review',review:'accepted',accepted:'production',payment:'production',production:'ready',ready:'completed',hold:'review'},ACT={review:'Start review',accepted:'Accept order',payment:'Mark payment pending',production:'Start production',ready:'Mark ready',completed:'Complete order',rejected:'Reject',cancelled:'Cancel order',hold:'Put on hold'};
  const kv=a=>'<dl class="kv">'+a.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl>',nx=FLOW[o.status];
  $('#v').innerHTML='<div id="detail" data-id="'+id+'"><div class="btns" style="justify-content:space-between;margin-top:14px"><button class="sec sm" id="bk">← Orders</button><span class="pill st-'+o.status+'">'+ST[o.status]+'</span></div><h2 style="font-size:24px;margin:12px 0 0">'+E(o.number)+'</h2><p class="muted" style="margin:2px 0 0">Received '+fmt(o.created)+'</p><div class="dg">'+
  '<section class="card full"><h3>Next step</h3>'+(nx.length?'<div class="btns">'+nx.map(s=>'<button class="'+(/^(rejected|cancelled)$/.test(s)?'bad':MAIN[o.status]===s?'':'sec')+'" data-st="'+s+'">'+ACT[s]+'</button>').join('')+'</div>':'<p class="muted">This order is '+ST[o.status].toLowerCase()+'. No further steps.</p>')+'</section>'+
  '<section class="card"><h3>Customer</h3>'+kv([['Name',E(c.name)],['Mobile',E(c.phone)]].concat(c.email?[['Email',E(c.email)]]:[]))+'<div class="btns"><a class="btn sec sm" href="tel:'+E(c.phone)+'">'+ic('ph')+'Call</a>'+(w?'<a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/'+w+'?text='+encodeURIComponent('Hello '+c.name+', your order '+o.number+' at '+CFG().shop_name+' is now: '+ST[o.status]+'.')+'">'+ic('wa')+'WhatsApp</a>':'')+'</div></section>'+
  '<section class="card"><h3>Print requirements</h3>'+kv([['Type',E(TY[p.type]||p.type)],['Paper size',E(p.size)],['Sides',p.sides==='double'?'Double-sided':'Single-sided'],['Orientation',p.orient==='landscape'?'Landscape':'Portrait'],['Copies',E(p.copies)],['Services',E(p.extras.join(', ')||'None')],['Instructions',E(o.instructions||'None')]])+'</section>'+
  '<section class="card full"><h3>Files ('+o.files.length+' of '+o.expected+' received)</h3>'+(o.files.map((f,i)=>'<div class="fi"><span>'+E(f.name)+' <small class="muted">'+(f.size/1024).toFixed(0)+' KB</small></span><button class="sec sm" data-pv="'+i+'">Preview</button><button class="sec sm" data-dl="'+i+'">Download</button></div>').join('')||'<p class="muted">No files on this device.</p>')+(o.files.length?'<p><button class="bad sm" id="rm">Delete files from this device</button></p>':'')+'</section>'+
  '<section class="card full"><h3>Activity</h3><ul class="tl">'+o.log.map(l=>'<li><span class="muted">'+fmt(l.t)+'</span> '+E(l.m)+'</li>').join('')+'</ul></section></div></div>';
  const save=async()=>{o.updated=Date.now();await putO(o);detail(id);stats()};
  $('#bk').onclick=()=>orders();
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const s=b.dataset.st;if(!FLOW[o.status].includes(s))return;if(/^(rejected|cancelled)$/.test(s)&&!confirm(ACT[s]+'? This cannot be undone.'))return;log(o,'Status '+ST[o.status]+' → '+ST[s]);o.status=s;save()});
  const open_=(i,dl)=>{const f=o.files[i],u=URL.createObjectURL(f.blob);if(dl){const a=document.createElement('a');a.href=u;a.download=f.name;a.click()}else open(u);setTimeout(()=>URL.revokeObjectURL(u),60000)};
  document.querySelectorAll('[data-pv]').forEach(a=>a.onclick=e=>{e.preventDefault();open_(+a.dataset.pv,false)});
  document.querySelectorAll('[data-dl]').forEach(a=>a.onclick=e=>{e.preventDefault();open_(+a.dataset.dl,true)});
  if($('#rm'))$('#rm').onclick=()=>{if(confirm('Delete all files of this order from this device? This cannot be undone.')){o.files=[];log(o,'Files deleted');save()}};
}
function qr(){

  $('#v').innerHTML='<div class="card center" id="qrcard">'+(l?'<img src="'+l+'" alt="" style="height:64px;max-width:200px;object-fit:contain">':'')+'<h1>'+E(c.shop_name)+'</h1><h2>Scan to send your printing</h2><div id="qrc" style="display:inline-block"></div><p><b>Scan • Upload • Submit</b></p>'+(c.address?'<p class="muted">'+E(c.address)+'</p>':'')+(c.phone?'<p class="muted">'+E(c.phone)+'</p>':'')+'</div><div class="card"><div class="btns"><button id="pr">Print QR card</button><button class="sec" id="cp">Copy customer link</button></div><p class="muted" style="overflow-wrap:anywhere">'+E(url)+'</p><p class="muted">Keep this page open during shop hours. Customers can only send files while it is open.</p></div>';

function settings(){
  const c=CFG();let logo=safeImg(c.logo);
  const f=(k,l,t)=>'<label for="'+k+'">'+l+'</label><input id="'+k+'"'+(t?' type="'+t+'"':'')+' value="'+E(c[k])+'">';
  $('#v').innerHTML='<section class="card"><h2>Shop profile</h2><p class="muted">Shown in the header of the customer page and on your QR card.</p><div class="btns" style="gap:14px"><div class="logo big" id="lp"></div><div class="btns"><button class="sec" id="lu">Upload logo</button><input id="lf" type="file" accept="image/*" hidden><button class="bad" id="lrm">Remove</button></div></div>'+f('shop_name','Shop name')+f('welcome','Welcome message')+'</section>'+
  '<section class="card"><h2>Contact and location</h2><p class="muted">Customers get Call, WhatsApp and Directions buttons from these details.</p><div class="sg"><div>'+f('phone','Phone number','tel')+'</div><div>'+f('whatsapp','WhatsApp number (with country code)','tel')+'</div></div>'+f('address','Address')+'</section>'+
  '<section class="card"><h2>Requests</h2><div class="sg"><div>'+f('max_mb','Max file size (MB)','number')+'</div><div>'+f('cc','Country code for customer numbers')+'</div></div><label for="extras">Additional services (one per line)</label><textarea id="extras" rows="4">'+E(svc(c).join('\n'))+'</textarea></section><div class="err" id="er" role="alert"></div><button id="sv">Save settings</button>';
  const paint=()=>{$('#lp').innerHTML=logo?'<img src="'+logo+'" alt="">':'<b>'+ini(c.shop_name)+'</b>';$('#lrm').hidden=!logo};paint();
  $('#lu').onclick=()=>$('#lf').click();$('#lrm').onclick=()=>{logo='';paint()};
  $('#lf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);const iw=im.width||256,ih=im.height||256,k=Math.min(1,256/Math.max(iw,ih)),w=Math.round(iw*k),h=Math.round(ih*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(im,0,0,w,h);let d=cv.toDataURL('image/png');if(d.length>150000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);d=cv.toDataURL('image/jpeg',.82)}logo=d;paint();$('#er').textContent='Logo ready. Press Save settings to apply it.'};
    im.onerror=()=>{URL.revokeObjectURL(u);$('#er').textContent='This image could not be read. Try a PNG or JPG.'};im.src=u};
  $('#sv').onclick=()=>{const g=k=>$('#'+k).value.trim(),mb=+g('max_mb'),er=$('#er');er.style.color='';
    if(!g('shop_name'))return er.textContent='Enter your shop name.';if(!(mb>0))return er.textContent='Enter a valid max file size.';
    try{localStorage.pd_cfg=JSON.stringify({shop_name:g('shop_name'),welcome:g('welcome'),phone:g('phone'),whatsapp:g('whatsapp'),address:g('address'),logo,cc:dg(g('cc')),max_mb:String(mb),extras:$('#extras').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n')})}catch{return er.textContent='Could not save. The logo may be too large.'}
    shell();go('settings');$('#er').style.color='var(--g)';$('#er').textContent='Settings saved.'};
}
