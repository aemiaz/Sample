<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#14213d">
<style>
:root{--ink:#14213d;--c:#0877b0;--m:#c2255c;--g:#168a45;--r:#b42318;--line:#dbe2ea;--mu:#566377;--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:#f2f5f9;color:#17202e}
main{max-width:980px;margin:0 auto;padding:0 14px 40px}
h1,h2,h3{font-family:var(--d)}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea,button{font:inherit;padding:11px 12px;border:1px solid #c3ccd8;border-radius:10px;min-height:46px;background:#fff;color:inherit}
input,select,textarea{width:100%}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;border:0;font-weight:600;cursor:pointer;padding:10px 16px;text-decoration:none;border-radius:10px;min-height:44px}
button.sec,.btn.sec{background:#e4eaf2;color:#17202e}.btn.wa{background:var(--g)}button.bad{background:#fff;color:var(--r);border:1px solid #e7b4af}
.gh{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.3)!important}
button.sm,.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brand{background:var(--ink);color:#fff}.brand :focus-visible{outline-color:#fff}
.bin{max-width:980px;margin:0 auto;padding:16px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cmyk{display:flex;height:6px}.cmyk i{flex:1}.cmyk i:nth-child(1){background:#00aeef}.cmyk i:nth-child(2){background:#ec008c}.cmyk i:nth-child(3){background:#fff200}.cmyk i:nth-child(4){background:#000}
.logo{width:60px;height:60px;border-radius:14px;background:#fff;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.logo b{display:grid;place-items:center;height:100%;background:var(--c);color:#fff;font:700 26px var(--d)}.logo.big{width:84px;height:84px;border:1px solid var(--line)}
.bi{flex:1;min-width:180px}.bi h1{margin:0 0 4px;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;margin:2px 0;font-size:14px;color:#cbd5e8}.meta a{color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cust .acts{flex-basis:100%}.own .acts{margin-left:auto}
.chip{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);font-size:14px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff6b6b;margin-right:6px}.dot.on{background:#3ddc84}
.bdg{background:var(--m);color:#fff;border-radius:10px;padding:0 6px;font-size:12px}
.intro{font-size:17px;margin:18px 0 4px}.muted{color:var(--mu);font-size:14px}.err{color:var(--r);font-size:14px;min-height:20px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-weight:400}.chk input{width:auto;min-height:0}.center{text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{background:none;color:var(--mu);border-radius:0;border-bottom:3px solid transparent;min-height:48px}.tabs button[aria-current=page]{color:var(--ink);border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat span{font-size:13px;color:var(--mu)}.stat b{display:block;font:700 28px/1.1 var(--d)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.bar>*{flex:1;min-width:160px}
.orow{display:grid;grid-template-columns:1.2fr 1.2fr 1.6fr auto;gap:6px 14px;align-items:center;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:8px;color:inherit;text-decoration:none}
.orow.new{border-left:4px solid var(--m)}.orow:hover{border-color:var(--c)}.orow b,.orow .muted{display:block}
.tag{display:inline-block;background:#eef2f7;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;margin:0 6px 4px 0}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;background:#e4eaf2;color:#3b4656;white-space:nowrap}
.st-new{background:#fde7ef;color:#9d1c4a}.st-review,.st-hold{background:#fff3cd;color:#7a5600}.st-accepted,.st-payment{background:#dff1fa;color:#065f8d}
.st-production{background:var(--ink);color:#fff}.st-ready{background:#dcf3e5;color:#0f6b36}.st-rejected,.st-cancelled{background:#fbe4e1;color:#912018}
.dg,.sg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 12px}.kv dt{color:var(--mu);font-size:14px}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.fi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.fi span{flex:1;min-width:140px;font-weight:600;overflow-wrap:anywhere}
.tl{margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);list-style:none}.tl li{padding:0 0 10px 6px}
@media(max-width:700px){.dg,.sg{grid-template-columns:1fr}.orow{grid-template-columns:1fr auto}.orow>:nth-child(2),.orow>:nth-child(3){grid-column:1/-1}.orow>:nth-child(4){grid-row:1;grid-column:2}}
@media print{body *{visibility:hidden}#qrcard,#qrcard *{visibility:visible}#qrcard{position:absolute;left:0;top:0;width:100%;border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sw .trk{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.35);position:relative;flex:none}.sw .trk i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on .trk{background:#3ddc84}.sw.on .trk i{left:18px}
.sr{position:absolute;width:1px!important;height:1px;min-height:0!important;padding:0!important;opacity:0;overflow:hidden}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;margin:0;border:2px dashed #9fb0c6;border-radius:16px;background:#f7fafd;text-align:center;cursor:pointer;color:var(--ink);font-weight:600;transition:background .15s,border-color .15s}
.drop svg{width:32px;height:32px;color:var(--c)}.drop:hover,.drop.over{border-color:var(--c);background:#eaf5fb}
.sr:focus-visible+.drop{outline:3px solid var(--c);outline-offset:2px}
.pickbtn{background:var(--c);color:#fff;border-radius:99px;padding:10px 22px;font-size:15px;box-shadow:0 2px 6px rgba(8,119,176,.35)}.drop:hover .pickbtn{background:#065f8d}
.th{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:#eef2f7}.th.ex{display:grid;place-items:center;font-size:12px;color:var(--c)}
.modal{position:fixed;inset:0;background:rgba(10,18,35,.7);z-index:50;display:grid;place-items:center;padding:12px}
.mbox{background:#fff;border-radius:14px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.mh b{flex:1;overflow-wrap:anywhere}
.mb{overflow:auto;padding:12px;flex:1;min-height:200px}.mb img{max-width:100%;display:block;margin:0 auto}.mb iframe{width:100%;height:70vh;border:0}
.pv{flex-basis:100%}.pv img{max-width:100%;max-height:420px;display:block;border-radius:8px;border:1px solid var(--line)}.pv canvas{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}.pv iframe{width:100%;height:60vh;border:0}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="app">Loading...</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ===== PrintDesk (single file, no server) =====
   Admin opens this page normally. Customers open it via QR (?shop=ID).
   Files travel phone -> shop computer directly (WebRTC). The shop page must be open to receive. */
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const SHOP=new URLSearchParams(location.search).get('shop');
const BASE=location.origin+location.pathname;
/* Cloud connection. Either paste your Supabase Project URL and key below, or enter them on the first-run setup screen. */
const SBC={url:'https://einznfibylssyjzyazok.supabase.co',key:'sb_publishable_2yIRQGN2DdHx_IEocU9btg_Dz9E8iSm'};
const qs=new URLSearchParams(location.search);
if(qs.get('u')&&qs.get('k')){localStorage.pd_u=qs.get('u');localStorage.pd_k=qs.get('k')}
const SB_URL=SBC.url||localStorage.pd_u||'',SB_KEY=SBC.key||localStorage.pd_k||'';
const sb=SB_URL&&window.supabase?supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:!SHOP,autoRefreshToken:!SHOP,detectSessionInUrl:false}}):null;
const ALLOWED={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function pdfPages(blob,max,scale,cb){const d=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise,n=Math.min(d.numPages,max);for(let i=1;i<=n;i++){const pg=await d.getPage(i),v=pg.getViewport({scale:scale(pg.getViewport({scale:1}))}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;cb(cv,i)}return d.numPages}
async function printFiles(o,idx){const p=o.opts,imgs=[],skip=[];
  for(const i of idx){const f=o.files[i],x=ext(f.name);
    if(/^(jpg|jpeg|png)$/.test(x))imgs.push(URL.createObjectURL((await blobOf(f))));
    else if(x==='pdf'){if(!window.pdfjsLib){open(URL.createObjectURL((await blobOf(f))));continue}await pdfPages((await blobOf(f)),500,()=>2,cv=>imgs.push(cv.toDataURL('image/jpeg',.92)))}
    else skip.push(f.name)}
  if(skip.length)alert('Word files cannot be printed directly from the browser. Please download and print: '+skip.join(', '));
  if(!imgs.length)return;
  const pg=/^(A3|A4|A5|Letter|Legal)$/i.test(p.size)?'size:'+p.size+' '+(p.orient==='landscape'?'landscape':'portrait')+';':'';
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;left:-10000px;top:0;width:800px;height:1100px;border:0';
  fr.srcdoc='<!doctype html><style>@page{'+pg+'margin:0}html,body{margin:0}img{display:block;max-width:100%;max-height:100vh;margin:0 auto;page-break-after:always}</style>'+imgs.map(u=>'<img src="'+u+'">').join('');
  fr.onload=()=>setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print();setTimeout(()=>fr.remove(),120000)},300);
  document.body.appendChild(fr)}
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const ST={new:'New',review:'Under Review',accepted:'Accepted',payment:'Payment Pending',production:'In Production',ready:'Ready',completed:'Completed',rejected:'Rejected',cancelled:'Cancelled',hold:'On Hold'};
const FLOW={new:['review','rejected','cancelled'],review:['accepted','rejected','cancelled','hold'],accepted:['payment','production','cancelled','hold'],payment:['production','cancelled'],production:['ready','hold'],ready:['completed'],hold:['review','accepted','production','cancelled'],completed:[],rejected:[],cancelled:[]};
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const DEF={shop_name:'My Print Shop',welcome:'Upload your documents and submit your printing requirements.',phone:'',whatsapp:'',address:'',hours:'',logo:'',cc:'92',max_mb:'20',extras:'Spiral binding\nLamination\nStapling'};
const CFG=()=>({...DEF,...JSON.parse(localStorage.pd_cfg||'{}')});
const svc=c=>{try{const j=JSON.parse(c.extras);if(Array.isArray(j))return j.map(String);if(j&&typeof j==='object')return Object.keys(j)}catch{}return String(c.extras||'').split('\n').map(x=>x.trim()).filter(Boolean)};
const dg=s=>String(s??'').replace(/\D/g,'');
const safeImg=s=>/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||'')?s:'';
const waNum=p=>{let d=dg(p);if(d.startsWith('00'))d=d.slice(2);else if(d[0]==='0')d=dg(CFG().cc)+d.slice(1);return d};
const fmt=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const ini=n=>E((String(n).trim().match(/[\p{L}\p{N}]/u)||['?'])[0].toUpperCase());
const TY={bw:'Black & White',color:'Color',photo:'Photo',other:'Other'};
const I={pr:'<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',clk:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',ph:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
 wa:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
 pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
 bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'};
const ic=n=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';
/* Shop header used on both customer ('cust') and owner ('own') sides */
function brand(c,m){const l=safeImg(c.logo),t=String(c.phone||'').trim(),a=String(c.address||'').trim(),w=dg(c.whatsapp),tl='tel:'+E(t.replace(/[^\d+]/g,''));
 const meta=(a?'<p class="meta">'+ic('pin')+'<span>'+E(a)+'</span></p>':'')+(t?'<p class="meta">'+ic('ph')+'<a href="'+tl+'">'+E(t)+'</a></p>':'')||(m==='own'?'<p class="meta"><a href="#" id="hint">Add your address and phone in Settings</a></p>':'');
 const acts=m==='cust'?(t?'<a class="btn gh" href="'+tl+'">'+ic('ph')+'Call</a>':'')+(w?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+w+'">'+ic('wa')+'WhatsApp</a>':''):
  '<span class="chip" id="dot"></span><button class="gh" id="bell" aria-label="Notifications">'+ic('bell')+'<span class="bdg" id="ub" hidden>0</span></button><button class="gh" id="lo">'+ic('out')+'Log out</button>';
 const hr=m==='cust'&&c.hours?'<p class="meta">'+ic('clk')+'<span>'+E(c.hours)+'</span></p>':'';
 return'<div class="brand"><div class="bin '+m+'"><div class="logo">'+(l?'<img src="'+l+'" alt="">':'<b>'+ini(c.shop_name)+'</b>')+'</div><div class="bi"><h1>'+E(c.shop_name)+'</h1>'+meta+hr+'</div><div class="acts">'+acts+'</div></div></div><div class="cmyk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>'}
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch{}};
addEventListener('offline',()=>alert('Connection Lost'));

/* ================= CUSTOMER ================= */
function customer(){
  let cfg,files=[],busy=false;
  const app=$('#app'),show=h=>app.innerHTML=h,head=c=>$('#hdr').innerHTML=brand(c,'cust');
  if(!sb)return show('<div class="card"><h2>This link is not set up</h2><p class="muted">Please scan the shop QR code again or ask the shop for a new link.</p></div>');
  show('<div class="card">Loading...</div>');
  (async()=>{try{const {data,error}=await sb.from('settings').select('data').eq('id',1).maybeSingle();if(error)throw error;cfg={...DEF,...((data&&data.data)||{})};cfg.extras=svc(cfg);form()}
    catch(e){console.error(e);show('<div class="card"><h2>Could not reach the shop</h2><p class="muted">Check your internet connection and try again.</p><button onclick="location.reload()">Try again</button></div>')}})();
  function form(){
    document.title=cfg.shop_name+' - Print Request';
    const last=JSON.parse(localStorage['pd_last_'+SHOP]||'null');
    head(cfg);show('<p class="intro">'+E(cfg.welcome)+'</p>'+
    (last?'<div class="card"><b>Your last request: '+E(last.number)+'</b><p id="st" class="muted"></p><button class="sec" id="chk">Check status</button></div>':'')+
    '<div class="card"><h2>Your details</h2><label for="n">Full name</label><input id="n" autocomplete="name"><label for="p">Mobile / WhatsApp</label><input id="p" type="tel" autocomplete="tel"><label for="e">Email (optional)</label><input id="e" type="email"></div>'+
    '<div class="card"><h2>Files</h2><input id="f" class="sr" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><label class="drop" id="dz" for="f">'+ic('up')+'<span class="dt">Select one or more files</span><span class="pickbtn">Browse files</span></label><div id="fl"></div><p class="muted">PDF, JPG, PNG, DOC, DOCX. Max '+E(cfg.max_mb)+' MB each, up to 10 files.</p></div>'+
    '<div class="card"><h2>Printing</h2><div class="row"><div><label for="t">Type</label><select id="t"><option value="bw">Black &amp; White</option><option value="color">Color</option><option value="photo">Photo</option><option value="other">Other</option></select></div><div><label for="s">Paper size</label><select id="s"><option>A4</option><option>A5</option><option>A3</option><option>Letter</option><option>Legal</option><option>Custom</option></select></div></div>'+
    '<div class="row"><div><label for="d">Sides</label><select id="d"><option value="single">Single-sided</option><option value="double">Double-sided</option></select></div><div><label for="o">Orientation</label><select id="o"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div><div><label for="c">Copies</label><input id="c" type="number" min="1" value="1" inputmode="numeric"></div></div>'+
    (cfg.extras.length?'<label>Additional services</label>'+cfg.extras.map(x=>'<label class="chk"><input type="checkbox" class="ex" value="'+E(x)+'">'+E(x)+'</label>').join(''):'')+
    '<label for="i">Special instructions</label><textarea id="i" rows="3"></textarea></div><div class="err" id="er" role="alert"></div><button id="go">Submit printing request</button>');
    if(last)$('#chk').onclick=async()=>{const {data,error}=await sb.rpc('order_status',{p_token:last.token});$('#st').innerHTML=error||!data?'Order not found':'Status: <span class="pill st-'+E(data)+'">'+E(ST[data]||data)+'</span>'};
    const dz=$('#dz');['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length){$('#f').files=e.dataTransfer.files;$('#f').dispatchEvent(new Event('change'))}});
    $('#f').onchange=e=>{const er=$('#er');er.textContent='';let skip=0;
      for(const f of [...e.target.files]){

  $('#sv').onclick=()=>{const g=k=>$('#'+k).value.trim(),mb=+g('max_mb'),er=$('#er');er.style.color='';
    if(!g('shop_name'))return er.textContent='Enter your shop name.';if(!(mb>0&&mb<=50))return er.textContent='Max file size must be between 1 and 50 MB.';
    const b={shop_name:g('shop_name'),welcome:g('welcome'),phone:g('phone'),whatsapp:g('whatsapp'),address:g('address'),hours:g('hours'),logo,cc:dg(g('cc')),max_mb:String(mb),extras:$('#extras').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n')};
    er.textContent='Saving...';sb.from('settings').upsert({id:1,data:b}).then(({error})=>{if(error)return er.textContent='Could not save: '+error.message;localStorage.pd_cfg=JSON.stringify(b);shell();go('settings');$('#er').style.color='var(--g)';$('#er').textContent='Settings saved.'})};
}
