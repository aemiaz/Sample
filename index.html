<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintDesk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#162033;--muted:#647084;--line:#e4e8ef;--paper:#fff;--canvas:#f6f8fb;--blue:#2f6df6;--blue-dark:#1e4ed8;--mint:#dbf8ed;--mint-ink:#087a58;--amber:#fff0cb;--amber-ink:#9a6100;--rose:#ffe3e1;--rose-ink:#ac332c;--shadow:0 18px 45px rgba(24,39,75,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 'DM Sans',system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,#edf4ff 0,transparent 32%),var(--canvas);color:var(--ink)}
main{width:min(1160px,100%);margin:0 auto;padding:28px 22px 64px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.03em}h1{font-size:clamp(26px,3vw,40px);line-height:1.1;margin:5px 0 9px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(228,232,239,.9);border-radius:var(--radius);padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#536075;margin:15px 0 6px}
input,select,textarea,button{font:inherit;width:100%;padding:12px 14px;border:1px solid #d7dde7;border-radius:11px;min-height:46px;background:#fff;color:inherit;transition:border-color .2s,box-shadow .2s,transform .2s}
input:focus,select:focus,textarea:focus{border-color:#7da2ff;box-shadow:0 0 0 4px rgba(47,109,246,.12);outline:0}
button{background:linear-gradient(135deg,var(--blue),#5c89ff);color:#fff;border:0;font-weight:700;cursor:pointer;width:auto;padding:11px 18px;box-shadow:0 8px 18px rgba(47,109,246,.18)}
button:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(47,109,246,.24)}button.sec{background:#eef2f7;color:#253247;box-shadow:none}button.danger{background:var(--rose);color:var(--rose-ink);box-shadow:none}
.pill{display:inline-flex;align-items:center;background:#eef2f7;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;color:#47546a}
.hero{position:relative;overflow:hidden;min-height:265px;padding:30px;border-radius:24px;color:#fff;background:linear-gradient(100deg,rgba(12,28,58,.93) 8%,rgba(18,51,105,.74) 56%,rgba(18,51,105,.15)),linear-gradient(135deg,#153d7d,#2f6df6);box-shadow:0 24px 60px rgba(21,45,92,.2);display:flex;align-items:flex-end}
.hero-content{position:relative;z-index:1;max-width:650px}.hero .eyebrow{color:#9fc0ff}.hero p{color:#d9e5ff;max-width:560px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.brand-mark{display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}.brand-mark:before{content:'✦';display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--blue);color:#fff}
.dashboard-head{display:flex;align-items:center;gap:13px;margin-bottom:14px}.dashboard-head .head-copy{flex:1}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.nav-tabs{display:flex;gap:7px;padding:5px;background:#eaf0f8;border-radius:14px;width:max-content;max-width:100%;margin-bottom:18px}.nav-tabs button{background:transparent;color:#68768b;box-shadow:none;padding:9px 14px;min-height:38px}.nav-tabs button.active,.nav-tabs button:hover{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(30,50,90,.08);transform:none}
.settings-card{max-width:820px}.micro-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#f4f7fb;color:#59687d;font-size:13px}
.status-open{background:var(--mint);color:var(--mint-ink)}.status-closed{background:var(--rose);color:var(--rose-ink)}
.hours-box{border:1px solid var(--line);background:#f8fafc;border-radius:15px;padding:16px;margin-top:14px}
.hours-preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hours-preview strong{font-size:14px}
.client-shell{max-width:760px;margin:0 auto}.shop-info{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);margin-bottom:16px}.shop-info .shop-copy{flex:1}.shop-info h1{font-size:clamp(25px,4vw,36px);margin:0 0 5px}.shop-info p{margin:3px 0;color:var(--muted);font-size:13px}
.shop-logo{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#2f6df6,#7ea4ff);color:#fff;font:700 26px 'Space Grotesk',sans-serif;box-shadow:0 12px 22px rgba(47,109,246,.22)}
.shop-contact{display:flex;gap:10px;flex-wrap:wrap;color:#4e5c72;font-size:12px;font-weight:600}.shop-contact span{padding:5px 9px;background:#f3f6fa;border-radius:8px}
.client-form{padding:24px}.upload-drop{display:flex;align-items:center;gap:13px;padding:17px 16px;border:1.5px dashed #aebfe4;border-radius:15px;background:linear-gradient(135deg,#f8fbff,#eef4ff);cursor:pointer}.upload-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:#dce8ff;color:var(--blue);font-size:27px;font-weight:700}.upload-copy{display:flex;flex-direction:column;gap:2px}
.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.files-list{margin-top:12px}.files-list p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 0;margin:0;border-bottom:1px solid #eef1f5}.files-list p:last-child{border-bottom:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}td,th{padding:14px 12px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7a8596}.tw{overflow-x:auto}
.order-card{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;background:#fff}.order-head{display:flex;gap:12px;align-items:center}.order-head>div:first-child{flex:1}.order-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.order-actions button{min-height:36px;padding:7px 11px;font-size:12px}.empty{text-align:center;padding:30px;color:#8490a2}
.connection-card{text-align:center;max-width:520px;margin:70px auto}.spinner{width:40px;height:40px;border:4px solid #e5ecf8;border-top-color:var(--blue);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){main{padding:16px 12px 44px}.card{padding:17px;margin:11px 0;border-radius:15px}.hero{padding:22px 18px;min-height:260px;border-radius:18px}.dashboard-head{align-items:flex-start;flex-wrap:wrap}.dashboard-head .actions{width:100%}.dashboard-head .actions button{flex:1}.nav-tabs{width:100%;overflow-x:auto}.nav-tabs button{flex:1;white-space:nowrap}.row>*{min-width:100%}.row>button{width:100%}.shop-info{align-items:flex-start}.shop-logo{width:48px;height:48px;flex:0 0 48px}}
</style>
</head>
<body>
<main id="app">Loading…</main>
<script>
'use strict';

const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const params=new URLSearchParams(location.search);
const SHOP=params.get('shop');
const KEY='printdesk_config_v4';
const ORD='printdesk_orders_v4';

const DEFAULT={
  shop_name:'My Print Shop',
  welcome:'Upload your documents and submit your printing requirements.',
  phone:'',
  whatsapp:'',
  address:'',
  currency:'Rs.',
  max_mb:'20',
  opening:'',
  closing:''
};

function cfg(){return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}
function saveCfg(c){localStorage.setItem(KEY,JSON.stringify(c))}
function orders(){return JSON.parse(localStorage.getItem(ORD)||'[]')}
function saveOrders(a){localStorage.setItem(ORD,JSON.stringify(a))}
function id(){return 'PD-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function esc(s){return E(s)}
function configuredHours(c){return !!(c.opening && c.closing)}
function minutes(v){const [h,m]=String(v).split(':').map(Number);return h*60+m}
function shopOpen(c){
  if(!configuredHours(c)) return true;
  const now=new Date(), cur=now.getHours()*60+now.getMinutes(), a=minutes(c.opening), b=minutes(c.closing);
  if(a===b)return true;
  return a<b ? cur>=a&&cur<b : cur>=a||cur<b;
}
function hoursText(c){
  if(!configuredHours(c)) return 'Business hours not set';
  return formatTime(c.opening)+' – '+formatTime(c.closing);
}
function formatTime(v){
  if(!v)return '';
  const [h,m]=v.split(':').map(Number);
  const ap=h>=12?'PM':'AM', hh=(h%12)||12;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}
function badge(c){
  if(!configuredHours(c))return '<span class="pill">Hours not set</span>';
  return shopOpen(c)?'<span class="pill status-open">● Open now</span>':'<span class="pill status-closed">● Closed now</span>';
}
function makeOrder(data){
  const a=orders(); a.unshift(data); saveOrders(a); return data;
}

function admin(){
  let tab='dashboard';
  render();
  function render(){
    const c=cfg();
    $('#app').innerHTML=`
      <div class="topbar"><div class="shop-title"><div class="brand-mark">PrintDesk</div></div><span>${badge(c)}</span></div>
      <div class="dashboard-head">
        <div class="head-copy"><div class="eyebrow">Shopkeeper dashboard</div><h1>${esc(c.shop_name)}</h1><p class="muted">Manage your print shop and customer ordering page.</p></div>
        <div class="actions"><button class="sec" id="openCustomer">Customer Page</button><button id="share">QR / Link</button></div>
      </div>
      <div class="nav-tabs">
        <button class="${tab==='dashboard'?'active':''}" data-tab="dashboard">Orders</button>
        <button class="${tab==='settings'?'active':''}" data-tab="settings">Shop Settings</button>
        <button class="${tab==='hours'?'active':''}" data-tab="hours">Opening Hours</button>
      </div>
      <section id="content"></section>`;
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
    $('#openCustomer').onclick=()=>location.href=location.pathname+'?shop=local';
    $('#share').onclick=shareLink;
    if(tab==='dashboard')dashboard();
    if(tab==='settings')settings();
    if(tab==='hours')hours();
  }

  function dashboard(){
    const c=cfg(), list=orders(), box=$('#content');
    box.innerHTML=`
      <div class="card">
        <div class="section-kicker"><div><h2>Orders</h2><p class="muted">Customer submissions received on this browser.</p></div><span class="pill">${list.length} total</span></div>
        <div id="orders">${list.length?list.map(orderHTML).join(''):'<div class="empty">No orders yet.</div>'}</div>
      </div>`;
    list.forEach(o=>{
      const el=document.querySelector('[data-order="'+o.id+'"]');
      if(!el)return;
      el.querySelector('.status-select').onchange=e=>updateStatus(o.id,e.target.value);
      el.querySelector('.delete-order').onclick=()=>{if(confirm('Delete this order?')){saveOrders(orders().filter(x=>x.id!==o.id));render()}};
    });
  }
  function orderHTML(o){
    return `<div class="order-card" data-order="${esc(o.id)}">
      <div class="order-head"><div><h3>${esc(o.name||'Customer')}</h3><div class="muted">${esc(o.id)} · ${new Date(o.created).toLocaleString()}</div></div><span class="pill">${esc(o.status||'New')}</span></div>
      <p class="muted">${esc(o.phone||'No phone')} ${o.notes?' · '+esc(o.notes):''}</p>
      <div class="tw"><table><tr><th>File</th><th>Size</th></tr>${(o.files||[]).map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.size)}</td></tr>`).join('')}</table></div>
      <div class="order-actions"><select class="status-select">
        ${['New','Under Review','Accepted','Payment Pending','In Production','Ready','Completed','Rejected','Cancelled','On Hold'].map(s=>`<option ${s===(o.status||'New')?'selected':''}>${s}</option>`).join('')}
      </select><button class="danger delete-order">Delete</button></div>
    </div>`;
  }
  function updateStatus(idv,status){
    const a=orders(),o=a.find(x=>x.id===idv);if(o){o.status=status;o.updated=Date.now();saveOrders(a);render()}
  }

  function settings(){
    const c=cfg();
    $('#content').innerHTML=`
      <div class="card settings-card"><h2>Shop information</h2>
        <div class="row"><div><label>Shop name</label><input id="shop_name" value="${esc(c.shop_name)}"></div><div><label>Phone</label><input id="phone" value="${esc(c.phone)}"></div></div>
        <label>Welcome message</label><textarea id="welcome" rows="3">${esc(c.welcome)}</textarea>
        <div class="row"><div><label>WhatsApp</label><input id="whatsapp" value="${esc(c.whatsapp)}" placeholder="+92..."></div><div><label>Maximum file size (MB)</label><input id="max_mb" type="number" min="1" value="${esc(c.max_mb)}"></div></div>
        <label>Address</label><input id="address" value="${esc(c.address)}">
        <div class="micro-note" style="margin-top:16px"><strong>Opening hours:</strong><span>Configure them in the Opening Hours tab. You can also delete them completely.</span></div>
        <button id="saveSettings" style="margin-top:16px">Save Shop Settings</button>
      </div>`;
    $('#saveSettings').onclick=()=>{
      const n={...cfg(),shop_name:$('#shop_name').value.trim()||DEFAULT.shop_name,welcome:$('#welcome').value.trim(),phone:$('#phone').value.trim(),whatsapp:$('#whatsapp').value.trim(),max_mb:$('#max_mb').value,address:$('#address').value.trim()};
      saveCfg(n);render();alert('Shop settings saved.');
    };
  }

  function hours(){
    const c=cfg();
    $('#content').innerHTML=`
      <div class="card settings-card">
        <h2>Opening & closing time</h2>
        <p class="muted">Set the hours customers should be allowed to submit orders. These times are completely controlled by the shopkeeper.</p>
        <div class="hours-box">
          <div class="hours-preview"><strong>Current:</strong><span>${configuredHours(c)?hoursText(c):'No business hours configured'}</span>${badge(c)}</div>
        </div>
        <div class="row">
          <div><label>Opening time</label><input id="opening" type="time" value="${esc(c.opening)}"></div>
          <div><label>Closing time</label><input id="closing" type="time" value="${esc(c.closing)}"></div>
        </div>
        <div class="micro-note"><strong>Tip:</strong><span>Leave either field empty and the hours are considered unset. Use “Delete Hours” below to remove both permanently.</span></div>
        <div class="actions" style="margin-top:16px">
          <button id="saveHours">Save Opening Hours</button>
          <button id="deleteHours" class="danger">Delete / Remove Hours</button>
        </div>
      </div>
      <div class="card"><h2>Customer behaviour</h2><p class="muted">${configuredHours(c)?`Customers see <strong>${hoursText(c)}</strong>. Orders are blocked outside these hours.`:'No opening/closing restriction is active. Customers can submit orders at any time.'}</p></div>`;
    $('#saveHours').onclick=()=>{
      const a=$('#opening').value,b=$('#closing').value;
      if((a&&!b)||(!a&&b)){alert('Please enter both opening and closing times, or leave both empty.');return}
      const n={...cfg(),opening:a,closing:b};saveCfg(n);render();alert(a?'Opening hours saved.':'Opening hours removed.');
    };
    $('#deleteHours').onclick=()=>{
      if(confirm('Delete the shop opening and closing times? Customers will no longer be restricted by business hours.')){
        const n={...cfg(),opening:'',closing:''};saveCfg(n);render();alert('Business hours deleted.');
      }
    };
  }

  function shareLink(){
    const url=location.origin+location.pathname+'?shop=local';
    navigator.clipboard?.writeText(url).then(()=>alert('Customer link copied.')).catch(()=>prompt('Customer link:',url));
  }
}

function customer(){
  const c=cfg();
  if(!SHOP){admin();return}
  $('#app').innerHTML=`
    <div class="client-shell">
      <div class="shop-info"><div class="shop-logo">${esc((c.shop_name||'P').charAt(0).toUpperCase())}</div><div class="shop-copy"><h1>${esc(c.shop_name)}</h1><p>${esc(c.welcome)}</p><div class="shop-contact">${c.phone?`<span>☎ ${esc(c.phone)}</span>`:''}${c.address?`<span>⌖ ${esc(c.address)}</span>`:''}${configuredHours(c)?`<span>◷ ${hoursText(c)}</span>`:'<span>Hours not set</span>'}</div></div></div>
      <div class="card client-form">
        <div class="eyebrow">Print request</div><h2>Submit your documents</h2><p class="muted">Upload your files and send the request to the shop.</p>
        ${configuredHours(c)&&!shopOpen(c)?`<div class="micro-note" style="background:#fff0ef;color:#9e3932;margin:18px 0"><strong>Shop closed:</strong><span>Orders are currently unavailable. Business hours are ${hoursText(c)}.</span></div>`:''}
        <label>Your name</label><input id="name" placeholder="Enter your name">
        <div class="row"><div><label>Phone</label><input id="phone" placeholder="03xx xxxxxxx"></div><div><label>Copies</label><input id="copies" type="number" min="1" value="1"></div></div>
        <label>Documents</label>
        <label class="upload-drop" for="files"><span class="upload-icon">↑</span><span class="upload-copy"><strong>Choose files</strong><span class="muted">PDF, JPG, PNG, DOC, DOCX · max ${esc(c.max_mb)} MB each</span></span></label>
        <input class="file-input" id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
        <div id="fileList" class="files-list"></div>
        <label>Notes / printing requirements</label><textarea id="notes" rows="4" placeholder="Black & white, color, pages, binding, etc."></textarea>
        <button id="submit" style="width:100%;margin-top:16px;font-size:16px;min-height:52px" ${configuredHours(c)&&!shopOpen(c)?'disabled':''}>Send Print Request</button>
        <p id="msg" class="muted" style="text-align:center;margin-top:12px"></p>
      </div>
    </div>`;
  const fileInput=$('#files'), list=$('#fileList'), submit=$('#submit'), chosen=[];
  fileInput.onchange=()=>{
    chosen.length=0;
    [...fileInput.files].forEach(f=>chosen.push(f));
    list.innerHTML=chosen.length?chosen.map(f=>`<p>📄 <strong>${esc(f.name)}</strong> <span class="muted">(${(f.size/1024/1024).toFixed(2)} MB)</span></p>`).join(''):'';
  };
  submit.onclick=async()=>{
    const name=$('#name').value.trim(),phone=$('#phone').value.trim(),max=(Number(c.max_mb)||20)*1024*1024;
    if(!name){alert('Please enter your name.');return}
    if(!chosen.length){alert('Please select at least one document.');return}
    if(chosen.some(f=>f.size>max)){alert(`A file exceeds the ${c.max_mb} MB limit.`);return}
    const allowed=['pdf','jpg','jpeg','png','doc','docx'];
    if(chosen.some(f=>!allowed.includes((f.name.split('.').pop()||'').toLowerCase()))){alert('Unsupported file type.');return}
    const o=makeOrder({id:id(),name,phone,copies:Number($('#copies').value)||1,notes:$('#notes').value.trim(),files:chosen.map(f=>({name:f.name,size:(f.size/1024/1024).toFixed(2)+' MB'})),status:'New',created:Date.now()});
    $('#msg').textContent=`Request ${o.id} submitted successfully.`;
    submit.disabled=true;submit.textContent='Request Sent ✓';
  };
}

window.addEventListener('storage',()=>{if(SHOP)customer();else admin()});
if(SHOP)customer();else admin();
</script>
</body>
</html>
